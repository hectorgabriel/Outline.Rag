# Local dependencies of the .NET RAG services. Kept separate from docker-compose.yml (the Outline stack)
# so the RAG index never lives in, or touches, Outline's own database.
#
#   docker compose -f docker-compose.rag.yml up -d      # pgvector only
#   ollama pull bge-m3                                   # on the native Ollama app (https://ollama.com/download)
#
# Ollama runs natively by default: Docker on macOS has no GPU access, so the container is much slower
# than the app (which uses Metal). Where the app isn't an option (Linux servers, CI), start the container
# instead; it binds the same :11434, so don't run both:
#   docker compose -f docker-compose.rag.yml --profile ollama up -d
#   docker compose -f docker-compose.rag.yml exec ollama ollama pull bge-m3
#
# Chat UI: Open WebUI on http://localhost:8080 (profile `ui`), talking to the Api's OpenAI-compatible /v1
# endpoints, so the Api must be running on :5157. It offers one model, `outline-wiki`:
#   docker compose -f docker-compose.rag.yml --profile ui up -d
name: outline-rag

services:
  rag-db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:-rag_dev_pw}
      POSTGRES_DB: outline_rag
    volumes:
      # Postgres 18+ expects the volume at /var/lib/postgresql (not .../data).
      - rag_db_data:/var/lib/postgresql
      - ./docker/rag-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # 5433 so it can run next to the Outline postgres on 5432.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d outline_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.4
    profiles: [ui]
    restart: unless-stopped
    environment:
      # Local, single-user setup: no login. Anyone who can reach :8080 can ask the wiki (and so can anyone who can
      # reach the Api, see the access-control note in README.md). Some of these settings are only read on first
      # start and then kept in the open_webui_data volume; change them in Admin Settings, or remove the volume.
      WEBUI_AUTH: "False"
      WEBUI_NAME: Outline RAG
      OPENAI_API_BASE_URL: http://host.docker.internal:5157/v1
      OPENAI_API_KEY: unused   # the Api doesn't check it yet
      DEFAULT_MODELS: outline-wiki
      # Only the RAG model: hide Ollama's raw models and the arena, and don't download Open WebUI's own RAG models.
      ENABLE_OLLAMA_API: "False"
      ENABLE_EVALUATION_ARENA_MODELS: "False"
      OFFLINE_MODE: "True"
      # These background tasks would send extra prompts to the only model, i.e. through the RAG pipeline.
      ENABLE_TITLE_GENERATION: "False"
      ENABLE_TAGS_GENERATION: "False"
      ENABLE_FOLLOW_UP_GENERATION: "False"
      ENABLE_AUTOCOMPLETE_GENERATION: "False"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "False"
      ENABLE_SEARCH_QUERY_GENERATION: "False"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - open_webui_data:/app/backend/data

volumes:
  rag_db_data:
  ollama_models:
  open_webui_data:
