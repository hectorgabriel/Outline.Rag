# Disposable, pre-populated Outline wiki for testing the RAG services locally.
# Unlike ../../docker-compose.yml it needs no production dump: seed.sh bootstraps an empty
# instance through Outline's API (installation.create) and imports public Markdown handbooks.
#
#   docker/outline-demo/seed.sh          # start the stack, create workspace + API key, import docs
#   docker compose -f docker/outline-demo/docker-compose.yml down -v   # throw it all away
#
# Runs Outline 1.10.1, the production version. It binds :3000, so stop the legacy stack first.
name: outline-demo

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: outline
      POSTGRES_PASSWORD: outline_demo_pw
      POSTGRES_DB: outline
    volumes:
      # Postgres 18+ expects the volume at /var/lib/postgresql (not .../data).
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outline -d outline"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  outline:
    image: outlinewiki/outline:1.10.1
    restart: unless-stopped
    # SECRET_KEY and UTILS_SECRET are generated by seed.sh into this (git-ignored) file.
    env_file:
      - .env
    environment:
      URL: http://localhost:3000
      PORT: "3000"
      DATABASE_URL: postgres://outline:outline_demo_pw@postgres:5432/outline
      PGSSLMODE: disable
      REDIS_URL: redis://redis:6379
      FORCE_HTTPS: "false"
      FILE_STORAGE: local
      FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
      # Lets Outline deliver webhooks to the RAG Api on the host (Docker Desktop's host.docker.internal).
      ALLOWED_PRIVATE_IP_ADDRESSES: ${ALLOWED_PRIVATE_IP_ADDRESSES:-192.168.65.0/24,172.16.0.0/12}
      # Email sign-in for the web UI: magic links land in Mailpit (http://localhost:8025), nothing is sent out.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_FROM_EMAIL: outline@example.com
      LOG_LEVEL: info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - outline_data:/var/lib/outline/data

volumes:
  postgres_data:
  outline_data:
